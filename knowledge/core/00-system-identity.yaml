schema_version: "1.0.0"
knowledge_id: "00-system-identity"
status: INVARIANT
description: >
  Identita systému gpts-decision-stack. Tento soubor definuje základní
  charakteristiky systému, jeho účel a capability třídy.

system:
  name: gpts-decision-stack
  type: decision_control_system
  purpose: >
    Strukturovaný rozhodovací systém řízený kontrolní rovinou,
    který zpracovává komplexní komerční a governance rozhodnutí
    prostřednictvím sekvence specializovaných GPT agentů.

architecture_layers:
  control_plane:
    description: >
      Neměnná vrstva orchestrace, auditu a release kontroly.
      Agenti řídicí roviny jsou INVARIANT a nesmí být měněni
      bez explicitní governance revize.
    agents:
      - CP-Governor
      - CP-ContractAuditor
      - CP-TransitionJudge
      - CP-ReleaseArbiter
  adaptive_engines:
    description: >
      Přizpůsobitelná vrstva zpracování jednotlivých kroků pipeline.
      Agenti mohou být konfigurováni per deployment.
    agents:
      - AE-Intake
      - AE-Framing
      - AE-Primitive
      - AE-Architecture
      - AE-Claims
      - AE-RiskGov
      - AE-Commercial
      - AE-ReviewRouter

capability_classes:
  pipeline_orchestration:
    owner: CP-Governor
    description: Řízení průchodu pipeline, re-entry a decision log.
  contract_audit:
    owner: CP-ContractAuditor
    description: Audit claims vůči dostupné evidenci.
  state_transition:
    owner: CP-TransitionJudge
    description: Validace přechodů mezi stavy pipeline.
  release_gate:
    owner: CP-ReleaseArbiter
    description: Finální gate před uvolněním artefaktu.

invariants:
  - Každý agent vrací právě jeden kanonický artefakt.
  - Komentáře v přirozeném jazyce nejsou přípustné jako výstup agenta.
  - INVARIANT agenti nesmí být upravováni bez explicitní governance revize.
  - Falešný proceed je kritické selhání systému.
