    description: >
      Cloudflare infrastruktura musí být provisionována pro produkci před prvním
      produkčním live deploymentem. Dev prostředí je live a provisionováno
      (viz operations/evidence/audit-evidence-bundle-dev.yaml). Resource IDs
      (D1 database_id, KV namespace id) jsou již vyplněny v backend/worker/wrangler.toml.
      Toto není blocking gap pro repo readiness (REPO-READY SKELETON),
      ale produkční provisioning je vyžadován před dosažením DEPLOY-READY STACK.
    required_actions:
      - "Nastavit CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID jako GitHub Secrets pro prod deployment"
      - "wrangler secret put API_KEY_SECRET (pro prod prostředí)"
      - "Verifikovat produkční D1/R2/KV prostředky jsou provisionovány (IDs jsou v backend/worker/wrangler.toml)"
      - "wrangler d1 execute gpts-decision-stack-db --file backend/worker/migrations/0001_init.sql (prod)"

