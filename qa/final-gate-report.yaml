    description: >
      Cloudflare infrastruktura musí být provisionována před prvním live
      deploymentem. Toto není blocking gap pro repo readiness, ale je
      vyžadováno před production deploymentem.
    required_actions:
      - "wrangler d1 create gpts-decision-stack-db (a vyplnit database_id do wrangler.toml)"
      - "wrangler r2 bucket create gpts-decision-stack-artifacts"
      - "wrangler kv namespace create POLICY_STORE (a vyplnit id do wrangler.toml)"
      - "wrangler secret put API_KEY_SECRET"
      - "Nastavit CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID jako GitHub Secrets"
      - "wrangler d1 execute gpts-decision-stack-db --file backend/worker/migrations/0001_init.sql"

