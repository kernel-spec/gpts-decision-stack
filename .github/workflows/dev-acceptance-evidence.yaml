name: Dev Acceptance Evidence

on:
  workflow_dispatch:

jobs:
  run-evidence:
    name: Run Dev Acceptance Evidence Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dev acceptance evidence script
        run: node scripts/evidence/run-dev-acceptance-evidence.mjs
        env:
          DEV_WORKER_URL: ${{ secrets.DEV_WORKER_URL }}
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}

      - name: Upload acceptance trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-acceptance-trace
          path: |
            artifacts/dev-acceptance-trace.json
            artifacts/dev-acceptance-summary.json
          if-no-files-found: warn

      - name: Upload acceptance evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-run-output-dev
          path: operations/evidence/acceptance-run-output-dev.yaml
          if-no-files-found: warn

      - name: Persist acceptance evidence via PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: operations/evidence/acceptance-run-output-dev.yaml
          branch: automation/dev-acceptance-evidence
          base: main
          commit-message: "chore(evidence): refresh dev acceptance evidence output"
          title: "chore(evidence): refresh dev acceptance evidence output"
          body: |
            Automated update of the dev acceptance evidence output.

            - Generated by: Dev Acceptance Evidence workflow
            - Evidence level: ACCEPTANCE
            - Acceptance tests exercised against live dev Cloudflare Worker
            - Governed verdict fields are **unchanged** (`overall_status: FAIL`, `deploy_ready: false`)
            - Acceptance success does not override fail-closed governance
            - `deploy_ready_stack` remains `false`

            This PR was created automatically and must be reviewed before merging to main.
