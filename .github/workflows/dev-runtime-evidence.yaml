name: Dev Runtime Evidence

on:
  workflow_dispatch:

jobs:
  run-evidence:
    name: Run Dev Runtime Evidence Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dev runtime evidence script
        run: node scripts/evidence/run-dev-runtime-evidence.mjs
        env:
          DEV_WORKER_URL: ${{ secrets.DEV_WORKER_URL }}
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}

      - name: Upload runtime trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-runtime-trace
          path: |
            artifacts/dev-runtime-trace.json
            artifacts/dev-runtime-summary.json
          if-no-files-found: warn

      - name: Upload audit evidence bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-bundle-dev
          path: operations/evidence/audit-evidence-bundle-dev.yaml
          if-no-files-found: warn

      - name: Persist canonical evidence bundle via PR
        uses: peter-evans/create-pull-request@v7
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: operations/evidence/audit-evidence-bundle-dev.yaml
          branch: automation/dev-runtime-evidence
          base: main
          commit-message: "chore(evidence): refresh canonical dev runtime evidence bundle"
          title: "chore(evidence): refresh canonical dev runtime evidence bundle"
          body: |
            Automated update of the canonical dev runtime evidence bundle.

            - Generated by: Dev Runtime Evidence workflow
            - Evidence level: STRONG_PARTIAL
            - Full pipeline validated through `release_decision`
            - Governed verdict fields are **unchanged** (`overall_status: FAIL`, `deploy_ready: false`)
            - Runtime success does not override fail-closed governance
            - `deploy_ready_stack` remains `false`

            This PR was created automatically and must be reviewed before merging to main.
