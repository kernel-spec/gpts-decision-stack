name: Dev Runtime Evidence

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-evidence:
    name: Run Dev Runtime Evidence Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Run dev runtime evidence script
        run: node scripts/evidence/run-dev-runtime-evidence.mjs
        env:
          DEV_WORKER_URL: ${{ secrets.DEV_WORKER_URL }}
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}

      - name: Upload runtime trace artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-runtime-trace
          path: |
            artifacts/dev-runtime-trace.json
            artifacts/dev-runtime-summary.json
          if-no-files-found: warn

      - name: Upload audit evidence bundle artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-evidence-bundle-dev
          path: operations/evidence/audit-evidence-bundle-dev.yaml
          if-no-files-found: warn
