name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target (dev or prod)"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight Cloudflare auth (validate)
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          if ! npx wrangler whoami; then
            echo "::error::Cloudflare auth preflight failed. Verify CLOUDFLARE_API_TOKEN permissions and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate D1 migration scope
        shell: bash
        run: |
          set -euo pipefail

          D1_DIR="migrations"

          if [ ! -d "$D1_DIR" ]; then
            echo "::error::D1 migration directory not found: $D1_DIR"
            exit 1
          fi

          if find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' | grep -q .; then
            echo "::error::Postgres-only migration file found in D1 scope:"
            find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' -print
            echo "::error::Move Postgres migrations to migrations/postgres/"
            exit 1
          fi

          PG_MARKERS_REGEX='TIMESTAMPTZ|DEFAULT[[:space:]]+NOW\(|::|SERIAL|CREATE[[:space:]]+INDEX.*USING|ALTER[[:space:]]+TABLE.*TYPE|USING[[:space:]]+gin|USING[[:space:]]+btree|gen_random_uuid|jsonb|RETURNING'

          offending_files="$(find "$D1_DIR" -maxdepth 1 -type f -name '*.sql' -print0 | xargs -0 -r grep -nE "$PG_MARKERS_REGEX" || true)"

          if [ -n "$offending_files" ]; then
            echo "::error::Postgres dialect markers detected in D1 migration scope:"
            echo "$offending_files"
            echo "::error::Only D1/SQLite-compatible SQL is allowed in migrations/"
            echo "::error::Move Postgres-specific migrations to migrations/postgres/"
            exit 1
          fi

          PG_DIR="migrations/postgres"
          if [ -d "$PG_DIR" ]; then
            if find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' | grep -q .; then
              echo "::error::Migration file in $PG_DIR/ is missing the _pg.sql suffix:"
              find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' -print
              echo "::error::All files in $PG_DIR/ must end with _pg.sql"
              exit 1
            fi
          fi

      - name: Type-check
        run: npm run build

      - name: Run tests
        run: npm test

  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight Cloudflare auth (dev)
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN for deploy-dev."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID for deploy-dev."
            exit 1
          fi

          if ! npx wrangler whoami; then
            echo "::error::Cloudflare auth preflight failed in deploy-dev. Verify CLOUDFLARE_API_TOKEN permissions and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guard D1 migration scope (dev)
        shell: bash
        run: |
          set -euo pipefail

          D1_DIR="migrations"

          if [ ! -d "$D1_DIR" ]; then
            echo "::error::D1 migration directory not found: $D1_DIR"
            exit 1
          fi

          if find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' | grep -q .; then
            echo "::error::Postgres-only migration file found in D1 scope:"
            find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' -print
            echo "::error::Move Postgres migrations to migrations/postgres/"
            exit 1
          fi

          PG_MARKERS_REGEX='TIMESTAMPTZ|DEFAULT[[:space:]]+NOW\(|::|SERIAL|CREATE[[:space:]]+INDEX.*USING|ALTER[[:space:]]+TABLE.*TYPE|USING[[:space:]]+gin|USING[[:space:]]+btree|gen_random_uuid|jsonb|RETURNING'

          offending_files="$(find "$D1_DIR" -maxdepth 1 -type f -name '*.sql' -print0 | xargs -0 -r grep -nE "$PG_MARKERS_REGEX" || true)"

          if [ -n "$offending_files" ]; then
            echo "::error::Postgres dialect markers detected in D1 migration scope:"
            echo "$offending_files"
            echo "::error::Only D1/SQLite-compatible SQL is allowed in migrations/"
            echo "::error::Move Postgres-specific migrations to migrations/postgres/"
            exit 1
          fi

          PG_DIR="migrations/postgres"
          if [ -d "$PG_DIR" ]; then
            if find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' | grep -q .; then
              echo "::error::Migration file in $PG_DIR/ is missing the _pg.sql suffix:"
              find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' -print
              echo "::error::All files in $PG_DIR/ must end with _pg.sql"
              exit 1
            fi
          fi

      - name: Apply D1 migrations (dev)
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply gpts-decision-stack-db-dev --env dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Dev
        run: |
          set -euo pipefail
          npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-prod:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight Cloudflare auth (prod)
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN for deploy-prod."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID for deploy-prod."
            exit 1
          fi

          if ! npx wrangler whoami; then
            echo "::error::Cloudflare auth preflight failed in deploy-prod. Verify CLOUDFLARE_API_TOKEN permissions and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guard D1 migration scope (prod)
        shell: bash
        run: |
          set -euo pipefail

          D1_DIR="migrations"

          if [ ! -d "$D1_DIR" ]; then
            echo "::error::D1 migration directory not found: $D1_DIR"
            exit 1
          fi

          if find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' | grep -q .; then
            echo "::error::Postgres-only migration file found in D1 scope:"
            find "$D1_DIR" -maxdepth 1 -type f -name '*_pg.sql' -print
            echo "::error::Move Postgres migrations to migrations/postgres/"
            exit 1
          fi

          PG_MARKERS_REGEX='TIMESTAMPTZ|DEFAULT[[:space:]]+NOW\(|::|SERIAL|CREATE[[:space:]]+INDEX.*USING|ALTER[[:space:]]+TABLE.*TYPE|USING[[:space:]]+gin|USING[[:space:]]+btree|gen_random_uuid|jsonb|RETURNING'

          offending_files="$(find "$D1_DIR" -maxdepth 1 -type f -name '*.sql' -print0 | xargs -0 -r grep -nE "$PG_MARKERS_REGEX" || true)"

          if [ -n "$offending_files" ]; then
            echo "::error::Postgres dialect markers detected in D1 migration scope:"
            echo "$offending_files"
            echo "::error::Only D1/SQLite-compatible SQL is allowed in migrations/"
            echo "::error::Move Postgres-specific migrations to migrations/postgres/"
            exit 1
          fi

          PG_DIR="migrations/postgres"
          if [ -d "$PG_DIR" ]; then
            if find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' | grep -q .; then
              echo "::error::Migration file in $PG_DIR/ is missing the _pg.sql suffix:"
              find "$PG_DIR" -maxdepth 1 -type f -name '*.sql' ! -name '*_pg.sql' -print
              echo "::error::All files in $PG_DIR/ must end with _pg.sql"
              exit 1
            fi
          fi

      - name: Apply D1 migrations (prod)
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply gpts-decision-stack-db --env prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production
        run: |
          set -euo pipefail
          npx wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}