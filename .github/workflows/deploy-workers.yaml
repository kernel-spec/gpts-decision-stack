name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - ".github/workflows/deploy-workers.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target (dev or prod)"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight Cloudflare auth (dev)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN for deploy-dev."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID for deploy-dev."
            exit 1
          fi
          if ! npx wrangler whoami; then
            echo "::error::Cloudflare auth preflight failed in deploy-dev. Verify CLOUDFLARE_API_TOKEN permissions and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Type-check
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: true   # tests are optional until test suite is added

  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preflight Cloudflare auth (prod)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN for deploy-prod."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID for deploy-prod."
            exit 1
          fi
          if ! npx wrangler whoami; then
            echo "::error::Cloudflare auth preflight failed in deploy-prod. Verify CLOUDFLARE_API_TOKEN permissions and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (dev)
        run: npx wrangler d1 migrations apply gpts-decision-stack-db-dev --env dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Dev
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-prod:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (prod)
        run: npx wrangler d1 migrations apply gpts-decision-stack-db --env prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production
        run: npx wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
