name = "gpts-decision-stack"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Bindings ----------

[[d1_databases]]
binding = "DECISIONS_DB"
database_name = "gpts-decision-stack-db"
# Set database_id after running: wrangler d1 create gpts-decision-stack-db
database_id = "d10b83ff-29a0-4ddd-99ac-c8fecf0a8ef3"

[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "gpts-decision-stack-artifacts"
# Create bucket with: wrangler r2 bucket create gpts-decision-stack-artifacts

[[kv_namespaces]]
binding = "POLICY_STORE"
# Create namespace with: wrangler kv namespace create POLICY_STORE
id = "b406728e872e41c8ac865946295ad4fc"

# API_KEY_SECRET is set as a Worker Secret, never in this file:
#   wrangler secret put API_KEY_SECRET

# ---------- Dev environment ----------

[env.dev]
name = "gpts-decision-stack-dev"

[[env.dev.d1_databases]]
binding = "DECISIONS_DB"
database_name = "gpts-decision-stack-db-dev"
database_id = "597ae973-2869-4ebb-89bd-1ebc62ac6674"

[[env.dev.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "gpts-decision-stack-artifacts-dev"

[[env.dev.kv_namespaces]]
binding = "POLICY_STORE"
id = "02dbad5ba7dd496f8f44865fba72ebed"

# ---------- Staging environment ----------

[env.staging]
name = "gpts-decision-stack-staging"

[[env.staging.d1_databases]]
binding = "DECISIONS_DB"
database_name = "gpts-decision-stack-db-staging"
database_id = "26d32c6f-fdcf-4ca4-b439-f3db7aa2f495"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "gpts-decision-stack-artifacts-staging"

[[env.staging.kv_namespaces]]
binding = "POLICY_STORE"
id = "7a55bedc6fa949c8afbe620d665ac79d"

# ---------- Production environment ----------

[env.prod]
name = "gpts-decision-stack"

[[env.prod.d1_databases]]
binding = "DECISIONS_DB"
database_name = "gpts-decision-stack-db"
database_id = "d10b83ff-29a0-4ddd-99ac-c8fecf0a8ef3"

[[env.prod.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "gpts-decision-stack-artifacts"

[[env.prod.kv_namespaces]]
binding = "POLICY_STORE"
id = "b406728e872e41c8ac865946295ad4fc"
