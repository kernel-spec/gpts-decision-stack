schema_version: "1.0.0"
artifact_type: endpoint_owner_mapping
description: >
  Mapování action API endpointů na funkční vlastníky v systému gpts-decision-stack.
  Pro každý endpoint jsou definovány: vlastník, agent, runtime závislost, auth
  mód, failure mód, požadavky na logování a auditování.
api_contract: actions/openapi.yaml

endpoints:
  - path: /health
    method: GET
    operation_id: getHealth
    owner_role: platform_operations
    agent: null
    runtime_dependency: Cloud Run health check
    auth_mode: none
    logging_required: false
    audit_required: false
    failure_mode: return_503_when_unhealthy

  - path: /session
    method: POST
    operation_id: createSession
    owner_role: control_plane_governor_function
    agent: CP-Governor
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_400 on invalid requestor_type;
      return_500 and log_error on Firestore write failure

  - path: /session/{session_id}
    method: GET
    operation_id: getSessionState
    owner_role: control_plane_governor_function
    agent: CP-Governor
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: false
    failure_mode: >
      return_404 on unknown session_id;
      return_500 and log_error on Firestore read failure

  - path: /session/{session_id}/artifact
    method: POST
    operation_id: submitArtifact
    owner_role: artifact_owning_agent_function
    agent: varies_by_artifact_type
    agent_mapping:
      ProblemBrief: AE-Intake
      FramingAssessment: AE-Framing
      OfferDecision: AE-Primitive
      ArchitectureSpec: AE-Architecture
      ClaimsDecision: AE-Claims
      RiskDecision: AE-RiskGov
      CommercialSpec: AE-Commercial
      ReviewTopologyPlan: AE-ReviewRouter
      StateDecisionPacket: CP-Governor
      ReleaseDecision: CP-ReleaseArbiter
    runtime_dependency:
      - Cloud Firestore
      - Cloud Storage
    auth_mode: api_key
    logging_required: true
    audit_required: true
    schema_validation_required: true
    failure_mode: >
      return_400 on schema validation failure;
      return_409 on artifact_type mismatch with current pipeline state;
      return_500 and log_error on Firestore or Storage write failure

  - path: /session/{session_id}/reentry
    method: POST
    operation_id: triggerReentry
    owner_role: control_plane_governor_function
    agent: CP-Governor
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_400 on missing or empty reentry_reason (silent re-entry rejected);
      return_400 on invalid target_state;
      return_500 and log_error on Firestore write failure
    governance_constraint: reentry_reason_required_minimum_10_chars

  - path: /session/{session_id}/decision-log
    method: GET
    operation_id: getDecisionLog
    owner_role: control_plane_governor_function
    agent: CP-Governor
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: false
    failure_mode: >
      return_404 on unknown session_id;
      return_500 and log_error on Firestore read failure

  - path: /veto/{session_id}/status
    method: GET
    operation_id: getVetoStatus
    owner_role: risk_governance_authority
    agent: CP-ReleaseArbiter
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_404 on unknown session_id;
      return_500 and log_error on Firestore read failure;
      unknown_veto_status treated as potentially_blocked by pipeline
    governance_constraint: unknown_veto_status_treated_as_potentially_blocked

  - path: /veto/{session_id}/activate
    method: POST
    operation_id: activateVeto
    owner_role: risk_governance_authority
    agent: CP-ReleaseArbiter
    authorized_callers:
      - risk_governance_authority
      - governance_review_authority
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_403 on insufficient veto authority;
      return_400 on missing required fields;
      return_500 and log_error on Firestore write failure
    governance_constraint: only_authorized_authority_may_activate_veto

  - path: /veto/{session_id}/release
    method: POST
    operation_id: releaseVeto
    owner_role: originating_veto_authority
    agent: CP-ReleaseArbiter
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_403 on veto_release_authority mismatch with originating authority;
      return_400 on missing required fields;
      return_500 and log_error on Firestore write failure
    governance_constraint: only_originating_authority_may_release_veto

  - path: /approval/{session_id}
    method: GET
    operation_id: getApprovals
    owner_role: control_plane_governor_function
    agent: CP-TransitionJudge
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: false
    failure_mode: >
      return_404 on unknown session_id;
      return_500 and log_error on Firestore read failure

  - path: /approval/{session_id}/submit
    method: POST
    operation_id: submitApproval
    owner_role: approval_authority_per_type
    agent: CP-TransitionJudge
    authority_by_approval_type:
      regulated_mandatory_approval: regulated_approval_board
      enterprise_procurement_approval: procurement_authority
      enterprise_legal_approval: legal_authority
      risk_governance_approval: risk_governance_authority
    runtime_dependency: Cloud Firestore
    auth_mode: api_key
    logging_required: true
    audit_required: true
    failure_mode: >
      return_403 on authority mismatch for approval_type;
      return_400 on invalid approval_status value;
      return_500 and log_error on Firestore write failure
    governance_constraint: authority_must_match_required_authority_for_approval_type

agent_endpoint_access:
  description: >
    Každý agent má přístup pouze k endpointům relevantním pro jeho funkci.
    Přístup je omezen na základě agent identity (submitted_by field) a
    API klíče vydaného pro daný GPT slot.
  CP-Governor:
    - "POST /session"
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
    - "POST /session/{session_id}/reentry"
    - "GET /session/{session_id}/decision-log"
  CP-ContractAuditor:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
    - "GET /session/{session_id}/decision-log"
  CP-TransitionJudge:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/reentry"
    - "GET /approval/{session_id}"
    - "POST /approval/{session_id}/submit"
  CP-ReleaseArbiter:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
    - "GET /veto/{session_id}/status"
    - "POST /veto/{session_id}/activate"
    - "POST /veto/{session_id}/release"
  AE-Intake:
    - "POST /session"
    - "POST /session/{session_id}/artifact"
  AE-Framing:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
  AE-Primitive:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
  AE-Architecture:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
  AE-Claims:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
  AE-RiskGov:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
    - "GET /veto/{session_id}/status"
  AE-Commercial:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
  AE-ReviewRouter:
    - "GET /session/{session_id}"
    - "POST /session/{session_id}/artifact"
    - "GET /approval/{session_id}"
