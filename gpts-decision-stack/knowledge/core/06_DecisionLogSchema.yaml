# Decision Log Schema
# Status: INVARIANT
# Structure for decision audit trail

decision_log_entry:
  schema:
    log_entry_id:
      type: string
      required: true
      pattern: "^LOG-[0-9]{10}$"
      description: Unique log entry identifier
    
    timestamp:
      type: string
      required: true
      format: iso8601_with_milliseconds
      description: Precise timestamp of log entry
    
    artifact_id:
      type: string
      required: true
      description: Artifact being processed
    
    decision_record:
      type: object
      required: true
      properties:
        decision_id:
          type: string
          required: true
        
        decision_maker:
          type: string
          required: true
          description: GPT role or authority making decision
        
        decision_type:
          type: string
          required: true
          enum:
            - STATE_TRANSITION
            - AUTHORITY_CHECK
            - VALIDATION
            - GOVERNANCE_ACTION
            - RELEASE_ACTION
        
        decision_outcome:
          type: string
          required: true
          enum:
            - APPROVED
            - REJECTED
            - BLOCKED
            - ESCALATED
            - FAILED
        
        rationale:
          type: string
          required: true
          min_length: 10
    
    state_context:
      type: object
      required: true
      properties:
        previous_state:
          type: string
          required: true
        
        attempted_state:
          type: string
          required: true
        
        resulting_state:
          type: string
          required: true
        
        transition_valid:
          type: boolean
          required: true
    
    authority_context:
      type: object
      required: true
      properties:
        authority_required:
          type: string
          required: true
        
        authority_held:
          type: string
          required: true
        
        authority_check_passed:
          type: boolean
          required: true
        
        authority_source:
          type: string
          required: true
    
    input_context:
      type: object
      required: true
      description: Full context provided to decision maker
      properties:
        artifacts:
          type: array
        
        evidence:
          type: array
        
        prior_decisions:
          type: array
        
        governance_constraints:
          type: object
    
    supporting_data:
      type: object
      required: false
      description: Additional data supporting the decision
    
    audit_metadata:
      type: object
      required: true
      properties:
        log_schema_version:
          type: string
          required: true
        
        log_integrity_hash:
          type: string
          required: true
          description: Hash of log entry for tamper detection
        
        previous_entry_hash:
          type: string
          required: false
          description: Hash of previous log entry for chain integrity
        
        correlation_id:
          type: string
          required: true
          description: Correlation ID for related decisions

log_chain_properties:
  immutability:
    - Log entries cannot be modified after creation
    - Log entries cannot be deleted
    - Log chain integrity is cryptographically verified
  
  completeness:
    - All decisions must be logged
    - No gaps in decision sequence
    - Failed decisions are logged
  
  integrity:
    - Each entry hashes previous entry
    - Chain integrity is verifiable
    - Tampering is detectable
  
  accessibility:
    - Logs are queryable by artifact_id
    - Logs are queryable by timestamp
    - Logs are queryable by decision_maker
    - Full audit trail is accessible

query_interfaces:
  by_artifact:
    input: artifact_id
    output: All log entries for artifact in chronological order
  
  by_decision_maker:
    input: decision_maker_id
    output: All decisions made by specific authority
  
  by_time_range:
    input: start_timestamp, end_timestamp
    output: All log entries in time range
  
  by_state_transition:
    input: from_state, to_state
    output: All transitions matching criteria
  
  integrity_check:
    input: log_entry_id
    output: Chain integrity verification result

retention_policy:
  minimum_retention: 7_years
  archive_after: 1_year
  deletion_policy: NEVER
  backup_frequency: CONTINUOUS

invariant_rules:
  - All decisions must be logged before execution
  - Log entries are immutable
  - Log chain integrity is mandatory
  - No decisions without audit trail

schema_version: "1.0.0"
status: INVARIANT
