openapi: "3.1.0"
info:
  title: gpts-decision-stack Actions API
  version: "1.0.0"
  description: >
    Backend-facing action contract for the gpts-decision-stack decision pipeline.
    GPT agents call these endpoints to persist pipeline state, enforce governance
    gates, and coordinate pipeline transitions. The model is not the system of
    record. All persistent state, veto enforcement, and release authority reside
    exclusively in the Cloudflare Workers backend service.

servers:
  - url: https://gpts-decision-stack.victorain92.workers.dev
    description: Development backend service (Cloudflare Workers)

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Per-slot API key issued for each GPT deployment slot.
        Stored as a Cloudflare Worker Secret and rotated operationally.

  schemas:
    HealthEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status, service, timestamp]
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
            timestamp:
              type: string
              format: date-time

    PipelineSession:
      type: object
      required: [session_id, pipeline_state, requestor_type, veto_active, created_at]
      properties:
        session_id:
          type: string
          description: Unique session identifier (UUID).
        pipeline_state:
          type: string
          enum:
            - intake
            - problem_framing
            - primitive_selection
            - architecture_validation
            - claims_validation
            - risk_governance_validation
            - commercial_packaging
            - release_decision
            - completed
            - blocked
          description: Current canonical pipeline state.
        requestor_type:
          type: string
          enum: [founder-led, enterprise, regulated, enablement]
        veto_active:
          type: boolean
          default: false
          description: Whether any active veto is currently blocking this session.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    DeliverySummary:
      type: object
      required:
        [current_stage, current_attempt, handoff_status, loop_flag, next_action_code, truth_completeness]
      properties:
        current_stage:
          type: string
          enum:
            - intake
            - problem_framing
            - primitive_selection
            - architecture_validation
            - claims_validation
            - risk_governance_validation
            - commercial_packaging
            - release_decision
        current_attempt:
          type: integer
          minimum: 0
          nullable: true
        handoff_status:
          type: string
          enum: [COMPLETED, FAILED, NONE, UNKNOWN]
        loop_flag:
          type: boolean
        next_action_code:
          type: string
          nullable: true
          enum:
            - AWAITING_TRUTH
            - NO_ACTIONABLE_NEXT_STEP
            - REPAIR_REQUIRED
            - HANDOFF_FAILED
            - LOOP_DETECTED
            - HANDOFF_COMPLETED
            - UNKNOWN
            - null
        truth_completeness:
          type: string
          enum: [FULL, PARTIAL, MISSING]

    ArtifactSubmission:
      type: object
      required: [session_id, artifact_type, artifact_payload, submitted_by]
      properties:
        session_id:
          type: string
        artifact_type:
          type: string
          enum:
            - ProblemBrief
            - FramingAssessment
            - OfferDecision
            - ArchitectureSpec
            - ClaimsDecision
            - RiskDecision
            - CommercialSpec
            - ReviewTopologyPlan
            - StateDecisionPacket
            - ReleaseDecision
        artifact_payload:
          type: object
          description: >
            The full canonical artifact payload. The backend validates this
            against the artifact's schema before accepting.
        submitted_by:
          type: string
          description: Canonical agent identifier (e.g. CP-Governor, AE-Intake).
        reentry:
          type: boolean
          default: false
        reentry_reason:
          type: string
          nullable: true
          description: Required and non-empty when reentry is true.

    ArtifactSubmissionResult:
      type: object
      required: [session_id, pipeline_state, artifact_type, accepted]
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        artifact_type:
          type: string
        accepted:
          type: boolean
        validation_errors:
          type: array
          items:
            type: string
          nullable: true

    DecisionLogEntry:
      type: object
      required: [entry_id, session_id, pipeline_state, decision_status, agent, timestamp]
      properties:
        entry_id:
          type: string
        session_id:
          type: string
        pipeline_state:
          type: string
        decision_status:
          type: string
          enum: [proceed, revise, invalidate, escalate, stop, unresolved, blocked]
        agent:
          type: string
        artifact_type:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        reentry:
          type: boolean
          default: false
        reentry_reason:
          type: string
          nullable: true

    DecisionLog:
      type: object
      required: [session_id, entries]
      properties:
        session_id:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DecisionLogEntry"

    ReentryRequest:
      type: object
      required: [target_state, reentry_reason]
      properties:
        target_state:
          type: string
          enum:
            - intake
            - problem_framing
            - primitive_selection
            - architecture_validation
            - claims_validation
            - risk_governance_validation
            - commercial_packaging
        reentry_reason:
          type: string
          minLength: 10
          description: Mandatory non-empty rationale for re-entry. Silent re-entry is rejected.
        authorized_by:
          type: string
          nullable: true

    VetoStatus:
      type: object
      required: [session_id, veto_active]
      properties:
        session_id:
          type: string
        veto_active:
          type: boolean
        veto_type:
          type: string
          enum: [operational_veto, model_veto]
          nullable: true
        veto_source:
          type: string
          nullable: true
          description: Originating authority that issued the veto.
        veto_activated_at:
          type: string
          format: date-time
          nullable: true
        veto_release_authority:
          type: string
          nullable: true
          description: Authority required to release the veto.

    VetoActivateRequest:
      type: object
      required: [veto_type, veto_source, veto_reason]
      properties:
        veto_type:
          type: string
          enum: [operational_veto, model_veto]
        veto_source:
          type: string
          description: >
            Canonical identity of the authority issuing the veto.
            Only risk_governance_authority or governance_review_authority
            may activate a veto.
        veto_reason:
          type: string
          minLength: 10

    VetoReleaseRequest:
      type: object
      required: [veto_release_authority, veto_release_reason, original_veto_reference]
      properties:
        veto_release_authority:
          type: string
          description: Must match the originating veto_source.
        veto_release_reason:
          type: string
          minLength: 10
        original_veto_reference:
          type: string
          description: Reference to the original veto record (entry_id or timestamp).

    ApprovalRecord:
      type: object
      required: [record_id, session_id, approval_type, authority, approval_status]
      properties:
        record_id:
          type: string
        session_id:
          type: string
        approval_type:
          type: string
          enum:
            - regulated_mandatory_approval
            - enterprise_procurement_approval
            - enterprise_legal_approval
            - risk_governance_approval
        authority:
          type: string
        approval_status:
          type: string
          enum: [pending, granted, denied, expired]
        granted_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true

    ApprovalList:
      type: object
      required: [session_id, approvals]
      properties:
        session_id:
          type: string
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRecord"

    ApprovalSubmitRequest:
      type: object
      required: [approval_type, authority, approval_status]
      properties:
        approval_type:
          type: string
          enum:
            - regulated_mandatory_approval
            - enterprise_procurement_approval
            - enterprise_legal_approval
            - risk_governance_approval
        authority:
          type: string
          description: >
            Canonical authority granting or denying the approval.
            Must correspond to the required authority for the approval_type.
        approval_status:
          type: string
          enum: [granted, denied]
        notes:
          type: string
          nullable: true

    FounderProjectStatus:
      type: object
      description: >
        Canonical founder-surface project status returned by Worker-backed state.
        The open and closed flags are returned explicitly by the backend and
        must be rendered as-is because Worker may manage them independently
        during transition or re-open flows.
      required: [project_id, current_phase, current_step, closed, open, main_blocker, next_surface, next_action, founder_decision_required]
      properties:
        project_id:
          type: string
          description: Canonical Worker-owned project identifier.
        current_phase:
          type: string
          description: Current canonical project phase from Worker-backed state.
        current_step:
          type: string
          description: Current canonical project step from Worker-backed state.
        closed:
          type: boolean
          description: Canonical closure flag returned by Worker-backed state.
        open:
          type: boolean
          description: Canonical open-work flag returned by Worker-backed state.
        main_blocker:
          type: string
          nullable: true
          description: Primary Worker-backed blocker, if any.
        next_surface:
          type: string
          description: Founder-facing surface where the next bounded action must be executed.
        next_action:
          type: string
          description: Next bounded action from canonical Worker-backed state.
        founder_decision_required:
          type: boolean
          description: True when progress must pause until request_founder_decision records an explicit founder decision.

    FounderNextAction:
      type: object
      required: [why_now, next_surface, next_action, where_to_do_it, copy_paste_block, evidence_to_save, fail_signal, founder_decision_required]
      properties:
        why_now:
          type: string
          description: Worker-backed rationale for why this action is currently next.
        next_surface:
          type: string
          description: Surface where the next action must be carried out.
        next_action:
          type: string
          description: Canonical next bounded action.
        where_to_do_it:
          type: string
          description: Canonical location or system in which the action must be completed.
        copy_paste_block:
          type: string
          nullable: true
          description: Optional ready-to-use block for the founder surface to render.
        evidence_to_save:
          type: array
          items:
            type: string
          description: Canonical evidence items that should be persisted after the action is completed.
        fail_signal:
          type: string
          nullable: true
          description: Canonical fail-closed signal that indicates the next action should not proceed.
        founder_decision_required:
          type: boolean
          description: True when the next action is blocked on request_founder_decision.

    FounderArtifactSaveRequest:
      type: object
      required: [artifact_type, metadata, content, submitted_by]
      properties:
        artifact_type:
          type: string
          description: Canonical artifact type to persist.
        metadata:
          type: object
          required: [run_id]
          additionalProperties: false
          description: Minimal artifact metadata persisted alongside the content.
          properties:
            run_id:
              type: string
              description: Canonical run identifier linked to the stored artifact.
            source_surface:
              type: string
              nullable: true
              description: Optional founder surface identifier for explicit provenance.
            source_role:
              type: string
              nullable: true
              description: Optional role identity attached to the artifact provenance.
            status:
              type: string
              nullable: true
              description: Optional artifact status label persisted in the metadata registry.
        content:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: array
              items: {}
            - type: number
            - type: boolean
          nullable: true
          description: Artifact content to be persisted through Worker-backed validation and storage. Supports structured objects, strings, and other JSON payloads accepted by the Worker runtime.
        submitted_by:
          type: string
          description: Founder-surface or operator identity submitting the artifact.
        linked_decision_id:
          type: string
          nullable: true
          description: Optional founder decision record that this artifact fulfills.

    FounderArtifactSaveResult:
      type: object
      required: [artifact_id, status, version, storage_path, linked_decision_id]
      properties:
        artifact_id:
          type: string
        status:
          type: string
        version:
          type: integer
          minimum: 1
        storage_path:
          type: string
        linked_decision_id:
          type: string
          nullable: true

    FounderModelOutputRecordRequest:
      type: object
      required: [run_id, role_name, output_type, raw_output]
      properties:
        run_id:
          type: string
          description: Canonical run identifier linked to the stored model output evidence.
        role_name:
          type: string
          description: Canonical model or role identifier that produced the output.
        output_type:
          type: string
          description: Bounded output class being recorded.
        raw_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: array
              items: {}
            - type: number
            - type: boolean
          nullable: true
          description: Raw model-produced output stored as evidence, not canonical truth by itself. Supports structured objects, strings, and other JSON payloads accepted by the Worker runtime.
        operator_notes:
          type: string
          nullable: true
          description: Optional operator notes attached to the stored evidence record.

    FounderModelOutputRecordResult:
      type: object
      required: [record_id, status, linked_run_id, suggested_artifact_update, founder_decision_required]
      properties:
        record_id:
          type: string
        status:
          type: string
        linked_run_id:
          type: string
          nullable: true
        suggested_artifact_update:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
          description: True when the recorded model output surfaces a founder gate that must be handled through request_founder_decision.

    FounderSellReadyStatus:
      type: object
      required: [closure_type, go_no_go, confirmed, missing, biggest_blocker, founder_decision_required]
      properties:
        closure_type:
          type: string
          enum: [sell_ready]
        go_no_go:
          type: string
          enum: [go, no_go, incomplete]
        confirmed:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        biggest_blocker:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean

    FounderProductionClosureStatus:
      type: object
      required: [closure_type, go_no_go, confirmed, missing, biggest_blocker, founder_decision_required, decision_type]
      properties:
        closure_type:
          type: string
          enum: [production_closure]
        go_no_go:
          type: string
          enum: [go, no_go, incomplete]
        confirmed:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        biggest_blocker:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
        decision_type:
          type: string
          nullable: true
          description: Founder decision type required before production closure can proceed, when applicable.

    FounderDecisionRequest:
      type: object
      required: [decision_type]
      properties:
        decision_type:
          type: string
          description: Canonical founder decision boundary to open or refresh.
        decision_context:
          type: string
          nullable: true
          description: Optional Worker-backed context that explains the active tradeoff.
        requested_by:
          type: string
          nullable: true
          description: Founder-surface identity requesting the decision payload.

    FounderDecisionResponse:
      type: object
      required: [decision_needed, why_it_cannot_be_skipped, option_a, option_b, recommended_option, founder_response_required]
      properties:
        decision_needed:
          type: boolean
          description: True when the Worker kernel has an active founder decision gate for this project.
        why_it_cannot_be_skipped:
          type: string
        option_a:
          type: string
        option_b:
          type: string
        recommended_option:
          type: string
        founder_response_required:
          type: boolean
          description: True when the founder console must collect a founder response now, even if a decision gate has already been opened or refreshed earlier.

    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /session:
    post:
      operationId: createSession
      summary: Create a new pipeline session
      description: >
        Initialises a new pipeline session at the intake stage.
        The session is the root record for all subsequent artifact
        submissions, state transitions, veto records, and decision log entries.
      tags: [pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestor_type]
              properties:
                requestor_type:
                  type: string
                  enum: [founder-led, enterprise, regulated, enablement]
                external_ref:
                  type: string
                  nullable: true
                  description: Optional external reference (ticket ID, project ID).
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSession"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized — missing or invalid API key.

  /session/{session_id}:
    get:
      operationId: getSessionState
      summary: Get current pipeline session state
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSession"
        "404":
          description: Session not found.
        "401":
          description: Unauthorized.

  /session/{session_id}/delivery:
    get:
      operationId: getDeliverySummary
      summary: Get operator-facing delivery summary for a session
      description: >
        Returns orchestration-derived delivery truth for the current session,
        including current stage, current attempt, latest handoff status,
        loop flag, and next action code. This endpoint is intended for
        operator-facing runtime checks and must not require UI-side joins
        across raw delivery tables.
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current delivery summary for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
        "404":
          description: Session not found.
        "401":
          description: Unauthorized.

  /session/{session_id}/artifact:
    post:
      operationId: submitArtifact
      summary: Submit a canonical artifact for the current pipeline stage
      description: >
        Persists the canonical artifact to the session record and records the
        corresponding decision log entry. The backend validates the artifact
        payload against the registered artifact schema before accepting.
        Returns 409 if the artifact_type does not match the current pipeline state.
        The model is never the system of record — all artifact persistence
        is managed by this endpoint.
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactSubmission"
      responses:
        "200":
          description: Artifact accepted and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSubmissionResult"
        "400":
          description: Invalid artifact payload or schema validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Artifact type not valid for current pipeline state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.

  /session/{session_id}/reentry:
    post:
      operationId: triggerReentry
      summary: Trigger an explicit pipeline re-entry
      description: >
        Records an explicit re-entry to an earlier pipeline stage in the
        decision log. Silent re-entry (no reason provided) is rejected with 400.
        The target_state must be a valid earlier pipeline stage.
        Re-entry does not erase existing decision log entries.
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReentryRequest"
      responses:
        "200":
          description: Re-entry recorded, session state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSession"
        "400":
          description: Missing or empty reentry_reason (silent re-entry rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.

  /session/{session_id}/decision-log:
    get:
      operationId: getDecisionLog
      summary: Get the full decision log for a pipeline session
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered list of all decision log entries for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLog"
        "404":
          description: Session not found.
        "401":
          description: Unauthorized.

  /veto/{session_id}/status:
    get:
      operationId: getVetoStatus
      summary: Get veto status for a pipeline session
      description: >
        Returns whether any active veto is blocking the session.
        UNKNOWN veto status is treated as potentially_blocked by the pipeline.
        The backend is the authoritative source of veto state — the model
        may not infer or assume veto status from context.
      tags: [governance]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current veto status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetoStatus"
        "404":
          description: Session not found.
        "401":
          description: Unauthorized.

  /veto/{session_id}/activate:
    post:
      operationId: activateVeto
      summary: Activate an operational veto on a pipeline session
      description: >
        Only risk_governance_authority or governance_review_authority may
        activate a veto. Once activated, the pipeline is hard-blocked until
        explicit veto_release from the originating authority. No other
        authority or artifact can bypass an active veto.
      tags: [governance]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VetoActivateRequest"
      responses:
        "200":
          description: Veto activated. Pipeline is now blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetoStatus"
        "400":
          description: Invalid veto request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient authority to activate veto.
        "401":
          description: Unauthorized.

  /veto/{session_id}/release:
    post:
      operationId: releaseVeto
      summary: Release an active veto on a pipeline session
      description: >
        Veto may only be released by the originating veto authority.
        A veto_release_authority mismatch returns 403. Release requires
        explicit veto_release_reason and original_veto_reference.
        Silent veto release is never permitted.
      tags: [governance]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VetoReleaseRequest"
      responses:
        "200":
          description: Veto released. Pipeline unblocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetoStatus"
        "400":
          description: Invalid release request (missing required fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Authority mismatch — only the originating veto authority
            may release this veto.
        "401":
          description: Unauthorized.

  /approval/{session_id}:
    get:
      operationId: getApprovals
      summary: Get all approval records for a pipeline session
      tags: [governance]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All approval records for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "404":
          description: Session not found.
        "401":
          description: Unauthorized.

  /approval/{session_id}/submit:
    post:
      operationId: submitApproval
      summary: Submit a manual approval decision
      description: >
        Records a granted or denied approval from the appropriate authority.
        The authority must correspond to the required authority for the
        approval_type. Mismatched authority returns 403.
        In regulated contexts, mandatory approval is required before the
        pipeline may transition to release_decision.
      tags: [governance]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalSubmitRequest"
      responses:
        "200":
          description: Approval recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecord"
        "400":
          description: Invalid approval submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient authority for this approval type.
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/status:
    get:
      operationId: get_project_status
      summary: Get canonical founder-surface project status
      description: >
        Returns the canonical founder-facing project status from Worker-backed state.
        The founder console and Custom GPT Actions are a UI layer only and must
        not infer state from chat context when this action can provide it.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical project status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProjectStatus"
        "404":
          description: Project not found.
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/next-action:
    get:
      operationId: get_next_action
      summary: Get the canonical next founder action
      description: >
        Returns the next bounded founder action from canonical Worker-backed
        state. The founder console must render this response directly and must
        not invent next steps when the backend can provide them.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical next action for the founder surface.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderNextAction"
        "404":
          description: Project not found.
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/artifact:
    post:
      operationId: save_artifact
      summary: Persist a founder-facing artifact
      description: >
        Persists founder-approved artifact metadata and content through the
        Worker kernel. Worker, D1, and R2 remain the source of truth for the
        stored artifact result.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderArtifactSaveRequest"
      responses:
        "200":
          description: Artifact persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderArtifactSaveResult"
        "400":
          description: Invalid artifact metadata or content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/model-output:
    post:
      operationId: record_model_output
      summary: Record model-produced output as founder-surface evidence
      description: >
        Records model-produced output as Worker-backed evidence. Raw model
        output is trace material only and does not become canonical business
        truth unless the backend later links it to persisted state.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderModelOutputRecordRequest"
      responses:
        "200":
          description: Model output recorded as evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderModelOutputRecordResult"
        "400":
          description: Invalid model output record request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/sell-ready:
    get:
      operationId: check_sell_ready
      summary: Check canonical sell-ready status
      description: >
        Evaluates sell-ready readiness from Worker-backed state and stored
        artifacts. A project must not be declared sell-ready without calling
        this action and using its canonical result.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical sell-ready evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderSellReadyStatus"
        "404":
          description: Project not found.
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/production-closure:
    get:
      operationId: check_production_closure
      summary: Check canonical production-closure status
      description: >
        Evaluates production closure readiness from Worker-backed state and
        stored artifacts. A project must not be declared production-closed
        without calling this action and using its canonical result.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical production-closure evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProductionClosureStatus"
        "404":
          description: Project not found.
        "401":
          description: Unauthorized.

  /founder/project/{project_id}/decision-request:
    post:
      operationId: request_founder_decision
      summary: Request an explicit founder decision payload
      description: >
        Opens or refreshes an explicit founder decision boundary from Worker-
        backed state. Founder tradeoff decisions must use this action; chat-only
        reasoning or informal founder intent is insufficient.
      tags: [founder]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderDecisionRequest"
      responses:
        "200":
          description: Canonical founder decision request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderDecisionResponse"
        "400":
          description: Invalid founder decision request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.

tags:
  - name: system
    description: Service health and metadata.
  - name: pipeline
    description: Pipeline session management and artifact submission.
  - name: governance
    description: Veto and manual approval governance operations.
  - name: founder
    description: Founder-console actions layered above Worker-backed canonical state.
