openapi: 3.1.0
info:
  title: gpts-decision-stack OpenAI Actions Import
  version: "1.0.0"
  description: >
    Builder-safe OpenAI Actions schema for the gpts-decision-stack
    Cloudflare Worker backend. This file is a subset of the canonical
    actions/openapi.yaml, limited to endpoints importable by the OpenAI
    Custom GPT Builder. The full contract (all endpoints, full schemas,
    security definitions) lives in actions/openapi.yaml.

servers:
  - url: https://gpts-decision-stack-dev.victorain92.workers.dev

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            service:
              type: string
            timestamp:
              type: string
          required:
            - status
            - service
            - timestamp
      required:
        - ok
        - data

    CreateSessionRequest:
      type: object
      properties:
        requestor_type:
          type: string
        external_ref:
          type: string
      required:
        - requestor_type

    SessionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        requestor_type:
          type: string
        veto_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    SessionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/SessionData"
      required:
        - ok
        - data

    ArtifactPayload:
      type: object
      properties: {}
      additionalProperties: true

    ArtifactSubmissionRequest:
      type: object
      properties:
        artifact_type:
          type: string
        payload:
          $ref: "#/components/schemas/ArtifactPayload"
        submitted_by:
          type: string
        reentry:
          type: boolean
        reentry_reason:
          type: string
      required:
        - artifact_type
        - payload
        - submitted_by

    ArtifactSubmissionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        artifact_type:
          type: string
        accepted:
          type: boolean
        validation_errors:
          type: array
          items:
            type: string

    ArtifactSubmissionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/ArtifactSubmissionData"
      required:
        - ok
        - data

    ReentryRequest:
      type: object
      properties:
        target_state:
          type: string
        reentry_reason:
          type: string
        authorized_by:
          type: string
      required:
        - target_state
        - reentry_reason

    FounderSellReadyStatus:
      type: object
      properties:
        closure_type:
          type: string
          enum:
            - sell_ready
        go_no_go:
          type: string
          enum:
            - go
            - no_go
            - incomplete
        confirmed:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        biggest_blocker:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
      required:
        - closure_type
        - go_no_go
        - confirmed
        - missing
        - biggest_blocker
        - founder_decision_required

    FounderProductionClosureStatus:
      type: object
      properties:
        closure_type:
          type: string
          enum:
            - production_closure
        go_no_go:
          type: string
          enum:
            - go
            - no_go
            - incomplete
        confirmed:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        biggest_blocker:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
        decision_type:
          type: string
          nullable: true
      required:
        - closure_type
        - go_no_go
        - confirmed
        - missing
        - biggest_blocker
        - founder_decision_required
        - decision_type

    FounderDecisionRequest:
      type: object
      properties:
        decision_type:
          type: string
        decision_context:
          type: string
          nullable: true
        requested_by:
          type: string
          nullable: true
      required:
        - decision_type

    FounderDecisionResponse:
      type: object
      properties:
        decision_needed:
          type: boolean
        why_it_cannot_be_skipped:
          type: string
        option_a:
          type: string
        option_b:
          type: string
        recommended_option:
          type: string
        founder_response_required:
          type: boolean
      required:
        - decision_needed
        - why_it_cannot_be_skipped
        - option_a
        - option_b
        - recommended_option
        - founder_response_required

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
        - ok
        - error
        - code

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session:
    post:
      operationId: createSession
      summary: Create a pipeline session
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}:
    get:
      operationId: getSessionState
      summary: Get session state
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/artifact:
    post:
      operationId: submitArtifact
      summary: Submit a canonical artifact
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactSubmissionRequest"
      responses:
        "200":
          description: Artifact accepted or rejected by validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSubmissionResponse"
        "400":
          description: Invalid artifact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Artifact invalid for current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/reentry:
    post:
      operationId: triggerReentry
      summary: Trigger explicit re-entry
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReentryRequest"
      responses:
        "200":
          description: Re-entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid re-entry request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/sell-ready:
    get:
      operationId: check_sell_ready
      summary: Check canonical sell-ready status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical sell-ready evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderSellReadyStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/production-closure:
    get:
      operationId: check_production_closure
      summary: Check canonical production-closure status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical production-closure evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProductionClosureStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/decision-request:
    post:
      operationId: request_founder_decision
      summary: Request an explicit founder decision payload
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderDecisionRequest"
      responses:
        "200":
          description: Canonical founder decision request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderDecisionResponse"
        "400":
          description: Invalid founder decision request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
