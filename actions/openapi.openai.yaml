openapi: 3.1.0
info:
  title: gpts-decision-stack OpenAI Actions Import
  version: "1.0.0"
  description: >
    Builder-safe OpenAI Actions schema for the gpts-decision-stack
    Cloudflare Worker backend.

servers:
  - url: https://gpts-decision-stack-dev.victorain92.workers.dev

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            service:
              type: string
            timestamp:
              type: string
          required:
            - status
            - service
            - timestamp
      required:
        - ok
        - data

    CreateSessionRequest:
      type: object
      properties:
        requestor_type:
          type: string
        external_ref:
          type: string
      required:
        - requestor_type

    SessionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        requestor_type:
          type: string
        veto_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    SessionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/SessionData"
      required:
        - ok
        - data

    ArtifactPayload:
      type: object
      properties: {}
      additionalProperties: true

    ArtifactSubmissionRequest:
      type: object
      properties:
        artifact_type:
          type: string
        artifact_payload:
          $ref: "#/components/schemas/ArtifactPayload"
        submitted_by:
          type: string
        reentry:
          type: boolean
        reentry_reason:
          type: string
      required:
        - artifact_type
        - artifact_payload
        - submitted_by

    ArtifactSubmissionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        artifact_type:
          type: string
        accepted:
          type: boolean
        validation_errors:
          type: array
          items:
            type: string

    ArtifactSubmissionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/ArtifactSubmissionData"
      required:
        - ok
        - data

    ReentryRequest:
      type: object
      properties:
        target_state:
          type: string
        reentry_reason:
          type: string
        authorized_by:
          type: string
      required:
        - target_state
        - reentry_reason

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
        - ok
        - error
        - code

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session:
    post:
      operationId: createSession
      summary: Create a pipeline session
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}:
    get:
      operationId: getSessionState
      summary: Get session state
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/artifact:
    post:
      operationId: submitArtifact
      summary: Submit a canonical artifact
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactSubmissionRequest"
      responses:
        "200":
          description: Artifact accepted or rejected by validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSubmissionResponse"
        "400":
          description: Invalid artifact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Artifact invalid for current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/reentry:
    post:
      operationId: triggerReentry
      summary: Trigger explicit re-entry
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReentryRequest"
      responses:
        "200":
          description: Re-entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid re-entry request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
