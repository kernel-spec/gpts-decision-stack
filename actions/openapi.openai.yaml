openapi: 3.1.0
info:
  title: gpts-decision-stack OpenAI Actions Import
  version: "1.0.0"
  description: >
    Builder-safe OpenAI Actions schema for the gpts-decision-stack
    Cloudflare Worker backend.

servers:
  - url: https://gpts-decision-stack-dev.victorain92.workers.dev

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            service:
              type: string
            timestamp:
              type: string
          required:
            - status
            - service
            - timestamp
      required:
        - ok
        - data

    CreateSessionRequest:
      type: object
      properties:
        requestor_type:
          type: string
        external_ref:
          type: string
      required:
        - requestor_type

    SessionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        requestor_type:
          type: string
        veto_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    SessionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/SessionData"
      required:
        - ok
        - data

    ArtifactPayload:
      type: object
      properties: {}
      additionalProperties: true

    ArtifactSubmissionRequest:
      type: object
      properties:
        artifact_type:
          type: string
        payload:
          $ref: "#/components/schemas/ArtifactPayload"
        submitted_by:
          type: string
        reentry:
          type: boolean
        reentry_reason:
          type: string
      required:
        - artifact_type
        - payload
        - submitted_by

    ArtifactSubmissionData:
      type: object
      properties:
        session_id:
          type: string
        pipeline_state:
          type: string
        artifact_type:
          type: string
        accepted:
          type: boolean
        validation_errors:
          type: array
          items:
            type: string

    ArtifactSubmissionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/ArtifactSubmissionData"
      required:
        - ok
        - data

    ReentryRequest:
      type: object
      properties:
        target_state:
          type: string
        reentry_reason:
          type: string
        authorized_by:
          type: string
      required:
        - target_state
        - reentry_reason

    FounderProjectStatusData:
      type: object
      properties:
        project_id:
          type: string
        current_phase:
          type: string
        current_step:
          type: string
        closed:
          type: boolean
        open:
          type: boolean
        main_blocker:
          type: string
          nullable: true
        next_surface:
          type: string
        next_action:
          type: string
        founder_decision_required:
          type: boolean
      required:
        - project_id
        - current_phase
        - current_step
        - closed
        - open
        - main_blocker
        - next_surface
        - next_action
        - founder_decision_required

    FounderProjectStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/FounderProjectStatusData"
      required:
        - ok
        - data

    FounderNextActionData:
      type: object
      properties:
        why_now:
          type: string
        next_surface:
          type: string
        next_action:
          type: string
        where_to_do_it:
          type: string
        copy_paste_block:
          type: string
          nullable: true
        evidence_to_save:
          type: array
          items:
            type: string
        fail_signal:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
      required:
        - why_now
        - next_surface
        - next_action
        - where_to_do_it
        - copy_paste_block
        - evidence_to_save
        - fail_signal
        - founder_decision_required

    FounderNextActionResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/FounderNextActionData"
      required:
        - ok
        - data

    FounderArtifactMetadata:
      type: object
      properties:
        run_id:
          type: string
        source_surface:
          type: string
          nullable: true
        source_role:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
      required:
        - run_id
      additionalProperties: false

    FounderJsonValue:
      description: JSON-compatible value accepted by the Worker-backed founder endpoints.
      anyOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
        - type: "null"

    FounderArtifactSaveRequest:
      type: object
      properties:
        artifact_type:
          type: string
        metadata:
          $ref: "#/components/schemas/FounderArtifactMetadata"
        content:
          $ref: "#/components/schemas/FounderJsonValue"
        submitted_by:
          type: string
        linked_decision_id:
          type: string
          nullable: true
      required:
        - artifact_type
        - metadata
        - content
        - submitted_by

    FounderArtifactSaveData:
      type: object
      properties:
        artifact_id:
          type: string
        status:
          type: string
        version:
          type: integer
        storage_path:
          type: string
        linked_decision_id:
          type: string
          nullable: true
      required:
        - artifact_id
        - status
        - version
        - storage_path
        - linked_decision_id

    FounderArtifactSaveResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/FounderArtifactSaveData"
      required:
        - ok
        - data

    FounderModelOutputRecordRequest:
      type: object
      properties:
        run_id:
          type: string
        role_name:
          type: string
        output_type:
          type: string
        raw_output:
          $ref: "#/components/schemas/FounderJsonValue"
        operator_notes:
          type: string
          nullable: true
      required:
        - run_id
        - role_name
        - output_type
        - raw_output

    FounderModelOutputRecordData:
      type: object
      properties:
        record_id:
          type: string
        status:
          type: string
        linked_run_id:
          type: string
          nullable: true
        suggested_artifact_update:
          type: string
          nullable: true
        founder_decision_required:
          type: boolean
      required:
        - record_id
        - status
        - linked_run_id
        - suggested_artifact_update
        - founder_decision_required

    FounderModelOutputRecordResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/FounderModelOutputRecordData"
      required:
        - ok
        - data

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
        - ok
        - error
        - code

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public liveness probe that returns only minimal service status metadata.
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session:
    post:
      operationId: createSession
      summary: Create a pipeline session
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}:
    get:
      operationId: getSessionState
      summary: Get session state
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/artifact:
    post:
      operationId: submitArtifact
      summary: Submit a canonical artifact
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactSubmissionRequest"
      responses:
        "200":
          description: Artifact accepted or rejected by validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactSubmissionResponse"
        "400":
          description: Invalid artifact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Artifact invalid for current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/{session_id}/reentry:
    post:
      operationId: triggerReentry
      summary: Trigger explicit re-entry
      security:
        - ApiKeyAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReentryRequest"
      responses:
        "200":
          description: Re-entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid re-entry request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/status:
    get:
      operationId: get_project_status
      summary: Get canonical founder project status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProjectStatusResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/next-action:
    get:
      operationId: get_next_action
      summary: Get canonical founder next action
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Founder next action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderNextActionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/artifact:
    post:
      operationId: save_artifact
      summary: Persist a founder-facing artifact
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderArtifactSaveRequest"
      responses:
        "200":
          description: Artifact persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderArtifactSaveResponse"
        "400":
          description: Invalid artifact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /founder/project/{project_id}/model-output:
    post:
      operationId: record_model_output
      summary: Record model output as founder evidence
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderModelOutputRecordRequest"
      responses:
        "200":
          description: Model output recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderModelOutputRecordResponse"
        "400":
          description: Invalid model output request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
