purpose: >
  Záznam výsledků živého testování Batch B commercial GPT rolí v prostředí
  ChatGPT Builder. Eviduje výsledky smoke checks, cross-role handoff testů,
  zjištěné problémy, jejich micro-fixy a závěrečné re-testy. Slouží jako
  deployment release evidence pro přechod na Batch C.

