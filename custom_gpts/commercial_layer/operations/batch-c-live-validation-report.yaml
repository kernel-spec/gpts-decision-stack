key_findings:
  - finding_id: KF-C-001
    severity: medium
    category: meta_output_leakage
    description: >
      DELIVERY_SOP_ENGINE produkoval raw meta-instrukce a placeholder-style výstupy
      z interních STOP RULES direktiv. Místo generování delivery SOP zobrazil
      operátorské instrukce jako "Vlož Output Contract (deliverables + timeline)"
      a pokyn pro pokračování s "[TBD]" hodnotami. Původní prompt propouštěl
      interní STOP RULES jako literální výstup.
    affected_files:
      - custom_gpts/commercial_layer/builder_compact/DELIVERY_SOP_ENGINE.builder.md
    resolution: >
      Aplikován první micro-fix: STOP RULES přeformulována do přirozených
      clarifying otázek místo operátorských direktiv. Průchod při dostupných
      vstupech přepsán z "proceed with [TBD]" na "proceed immediately and produce
      full SOP output". Přidána explicitní pravidla HARD RULES zakazující meta-instrukce
      a placeholder text. WHAT YOU MUST PRODUCE rozšířeno na 10 explicitních bloků
      s typovanými fieldy. SELF-CHECK zpřísněn.
    resolution_status: RESOLVED
    retest_result: PASS
    retest_ids:
      - retest_delivery_sop_meta_output_fix

  - finding_id: KF-C-002
    severity: medium
    category: clarification_over_gating
    description: >
      DELIVERY_SOP_ENGINE zůstal po prvním micro-fixu přílišně brzděn clarification
      logikou. Při absenci explicitního pole output_contract role vždy pokládala
      dotaz "Co přesně dodáváš? (deliverables + timeline)" — i když vstup obsahoval
      sold offer, client type a delivery window dostatečné k inferenci delivery
      kontraktu. Role nevyužívala dostupný kontext k přímému generování SOP.
    affected_files:
      - custom_gpts/commercial_layer/builder_compact/DELIVERY_SOP_ENGINE.builder.md
    resolution: >
      Aplikován druhý micro-fix: STOP RULES přepsána na inference-first logiku —
      výchozí chování je "proceed immediately". Clarifying dotaz povolen pouze pokud
      jsou SPLNĚNY OBĚ podmínky: (1) offer je příliš vágní k inferenci delivery
      shape, (2) chybějící informace by materiálně změnila strukturu SOP.
      Přidána sekce INFERENCE RULES definující "bounded offer" threshold (≥ 2 ze 3:
      named scope, delivery window, client type) a konzervativní sprint strukturu.
      MIN INPUT přesunuta z hard-required na "infer when absent". HARD RULES rozšířeny
      o přímé generování při přítomnosti sold offer + window + client type.
      SELF-CHECK doplněn o 4 nové položky pokrývající inference disciplínu.
    resolution_status: RESOLVED
    retest_result: PASS
    retest_ids:
      - retest_delivery_sop_clarification_blocking

  - finding_id: KF-C-003
    severity: info
    category: role_behavior
    description: >
      CALL_CLOSER prošel live testy bez nutnosti opravy. One-next-step discipline,
      qualification gates, no-pressure language a expectation-setting po close
      fungovaly správně bez micro-fixu.
    resolution: confirmed_by_testing
    resolution_status: CLOSED
    retest_result: PASS

